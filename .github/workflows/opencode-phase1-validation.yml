name: OpenCode phase 1 validation
on:
  push:
    branches: [codex/opencode-phase1-validation]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux:
    if: github.repository == 'cjyhjy/uni-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r scripts/validation/opencode-phase1-requirements.txt
      - name: Install pinned native CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --ignore-scripts --no-audit --no-fund opencode-linux-x64-baseline@1.19.3
          echo "OPENCODE_BIN=$RUNNER_TEMP/opencode/node_modules/opencode-linux-x64-baseline/bin/opencode" >> "$GITHUB_ENV"
      - name: Combined checkout on actual PR 298
        run: bash scripts/validation/run_opencode_phase1.sh results/combined
      - name: Cancellation bursts and slow snapshot experiment
        run: PYTHONPATH=. python scripts/validation/local_cleanup_burst.py --output results/burst.json | tee results/burst.log
      - uses: actions/checkout@v4
        with:
          ref: 61681e93e9d494a5879a0a894906f1c4083c0361
          path: provider
      - name: Provider-only on actual PR 234
        working-directory: provider
        run: |
          PYTHONPATH=. python -m pytest tests/uni_agent/sandbox/test_local_sandbox.py tests/uni_agent/sandbox/test_local_descendant_groups.py -q --tb=short --junitxml=../results/provider.xml | tee ../results/provider.log
      - uses: actions/checkout@v4
        with:
          ref: 51ab29fe8b56d6c45dce7d4fc50c61f332374bf7
          path: baseline
      - name: Same-group comparison against unchanged PR 234
        working-directory: baseline
        run: PYTHONPATH=. python ../scripts/validation/local_cleanup_burst.py --groups same --ps-delay-ms 0 --output ../results/burst-baseline.json | tee ../results/burst-baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-python-${{ matrix.python }}
          path: results/
  sidecar:
    if: github.repository == 'cjyhjy/uni-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.18', '1.19.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/validation/opencode-phase1-requirements.txt
      - name: Build exact 298 sidecar or version-only experiment
        env:
          CLI_VERSION: '${{ matrix.version }}'
        run: |
          mkdir -p results
          args=()
          if [ "$CLI_VERSION" = 1.19.3 ]; then
            args+=(--build-arg OPENCODE_VERSION=1.19.3 --build-arg OPENCODE_SHA512=11d46c02fd50140d73da20bc66628a75322d6a57dbe5eb37cd124958dcb11d687f0be2b0038b29780dff42adab3de2b3c78c5f8ddaac519ab40617018ffec3c6)
          fi
          docker build --progress=plain "${args[@]}" -t ua-opencode-phase1 examples/sidecar/opencode 2>&1 | tee results/build.log
          docker image inspect ua-opencode-phase1 > results/image.json
          cid=$(docker create ua-opencode-phase1 /bin/true)
          mkdir -p "$RUNNER_TEMP/payload"
          docker export "$cid" | tar -x -C "$RUNNER_TEMP/payload"
          docker rm "$cid"
          sudo mkdir -p /opt/opencode
          sudo mount --bind "$RUNNER_TEMP/payload" /opt/opencode
          sudo mount -o remount,bind,ro /opt/opencode
          mount | grep /opt/opencode > results/mount.txt
          /opt/opencode/bin/probe.sh | tee results/startup.log
      - name: Unchanged sidecar is rejected before model requests
        if: matrix.version == '1.18.18'
        run: PYTHONPATH=. python scripts/validation/check_sidecar_version_boundary.py /opt/opencode/bin/opencode | tee results/version-boundary.json
      - name: Compatible version experiment through read-only mounted sidecar
        if: matrix.version == '1.19.3'
        env:
          OPENCODE_BIN: /opt/opencode/bin/opencode
        run: bash scripts/validation/run_opencode_phase1.sh results/combined-sidecar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidecar-${{ matrix.version }}
          path: results/
