name: OpenCode phase 2 candidates
on:
  push:
    branches: [codex/opencode-phase2-candidates]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  sidecar:
    if: github.repository == 'cjyhjy/uni-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.19.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/validation/opencode-phase1-requirements.txt
      - name: Build exact 298 sidecar or version-only experiment
        env:
          CLI_VERSION: '${{ matrix.version }}'
        run: |
          mkdir -p results
          args=()
          if [ "$CLI_VERSION" = 1.19.3 ]; then
            args+=(--build-arg OPENCODE_VERSION=1.19.3 --build-arg OPENCODE_SHA512=11d46c02fd50140d73da20bc66628a75322d6a57dbe5eb37cd124958dcb11d687f0be2b0038b29780dff42adab3de2b3c78c5f8ddaac519ab40617018ffec3c6)
          fi
          docker build --progress=plain "${args[@]}" -t ua-opencode-phase1 examples/sidecar/opencode 2>&1 | tee results/build.log
          docker image inspect ua-opencode-phase1 > results/image.json
          cid=$(docker create ua-opencode-phase1 /bin/true)
          mkdir -p "$RUNNER_TEMP/payload"
          docker export "$cid" | tar -x -C "$RUNNER_TEMP/payload"
          docker rm "$cid"
          sudo mkdir -p /opt/opencode
          sudo mount --bind "$RUNNER_TEMP/payload" /opt/opencode
          sudo mount -o remount,bind,ro /opt/opencode
          mount | grep /opt/opencode > results/mount.txt
          /opt/opencode/bin/probe.sh | tee results/startup.log
      - name: Loader experiment
        run: python scripts/validation/probe_sidecar_loader.py results/loader.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidecar-${{ matrix.version }}
          path: results/
